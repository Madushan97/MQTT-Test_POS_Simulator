# ---------------------------------------------------------------------------
# 100-device fleet simulator: brings a random pool of real devices "online",
# then churns some of them offline/back-online so you can watch Fleet
# Overview, Dormancy and Merchant Feedback react.
#
# IMPORTANT — two independent signals, don't confuse them:
#  - MQTT register/ECHO (this file's broker.* section) proves the TMS push
#    channel itself works: visible as [MQTT-IN]/[MQTT-OUT] in the TMS log.
#    It does NOT move Fleet Overview's online/offline/active/inactive counts.
#  - The periodic "sale" call to WireMe core (core.* section) is what does:
#    FleetOverviewRollupJob derives ONLINE/OFFLINE/ACTIVE/INACTIVE purely from
#    DEVICES.LASTACTIVE, and that column is written by WireMe core on a real
#    transaction, not by anything in this TMS's MQTT push path. Churning a
#    device here pauses BOTH signals for it, to look like a terminal that has
#    genuinely gone dark.
# ---------------------------------------------------------------------------

# --- Device pool -------------------------------------------------------------
# Read directly from the same Oracle DB the TMS uses (DEVICES joined to
# TERMINALS/MERCHANTS — see DeviceDbClient), read-only, one SELECT, no TMS
# backend involved. Real serialNo+IMEI pairs, so MQTT register actually
# succeeds (status 000). Defaults below match the shared dev/UAT RDS already
# in docker-compose.yml's advance-insights-txms/tms services — override if
# you're pointed at a different environment.
db.host=hnb-advance-insight-aws-rds.cjyi08eoo8wy.ap-south-1.rds.amazonaws.com
db.port=1521
db.sid=ORCL
db.username=wireme_hnb
db.password=hnb123
# How many random active devices to simulate (50-100 per your ask).
fleet.size=80
# Stagger initial connects so 80-100 MQTT clients don't all dial in at once.
fleet.connect-ramp-up-ms=150

# --- Broker (must match tms.push.mqtt.* on the TMS you're pointed at) -------
broker.url=tcp://localhost:1883
broker.username=
broker.password=
topic.prefix=tms/push
qos=1
keepalive.seconds=30
connect.timeout.seconds=10
# Per-device ECHO cadence once connected.
echo.interval.seconds=20

# --- WireMe core UAT (moves DEVICES.LASTACTIVE) -----------------------------
core.sale-url=http://124.43.71.173:28071/api/core/v1/transactions
# Once every sale.interval.seconds, a random subset of the currently-online
# fleet sells (a different subset each round) — not every device every round.
sale.interval.seconds=60
sale.batch-size=15
core.amount-min=100
core.amount-max=250000
core.currency=LKR

# --- Churn: after the fleet is fully up, cycle some devices offline/online --
churn.enabled=true
# Wait this long after the last device connects before the first churn pass.
churn.start-delay-seconds=180
churn.interval-seconds=120
# Fraction of currently-online devices dropped to offline each pass.
churn.offline-fraction=0.15
# Fraction of currently-offline devices brought back online each pass.
churn.recover-fraction=0.05

# --- Logs --------------------------------------------------------------------
log.dir=logs
log.file=fleet.log
status.interval.seconds=30
