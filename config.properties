# ---------------------------------------------------------------------------
# POS terminal simulator config. Edit and restart to test a different terminal.
# ---------------------------------------------------------------------------

# --- Terminal identity ------------------------------------------------------
# serial-number + imei must match an ACTIVE device in the TMS DB, otherwise the
# server answers register with status 101 (INVALID_DEVICE).
terminal.serial-number=2840033191
terminal.imei=2840033191
# merchant-id / terminal-id are sent as `mid` / `tid` in the DIN (device info)
# confirm, which is how the TMS stores them, and are included in register/echo.
terminal.merchant-id=111155551111555
terminal.terminal-id=15151515
terminal.model=SIM-POS-X1
terminal.firmware=1.0.0

# --- Broker (the MQTT container; must match tms.push.mqtt.* in the TMS) -----
broker.url=tcp://localhost:1883
broker.username=
broker.password=
# Must equal the TMS tms.push.mqtt.topic-prefix (PUSH_MQTT_TOPIC_PREFIX)
topic.prefix=tms/push
qos=1
# MQTT protocol keep-alive: the client sends a PINGREQ if idle this long
# (broker replies PINGRESP). A missed one drops the connection.
keepalive.seconds=30
connect.timeout.seconds=10

# --- Behaviour --------------------------------------------------------------
# Register (topic .../push-devices/create) on every (re)connect
auto-register=true
# Application-level ping: ECHO on .../push-devices/message; the server's reply
# is the "pong" and its round-trip time is logged.
echo.interval.seconds=10
# Liveness summary line in the log
status.interval.seconds=30
# Status sent when confirming a server-pushed command: SUCCESS or anything else
# (e.g. FAIL) to test the failure path.
command.confirm-status=SUCCESS

# --- Logs -------------------------------------------------------------------
# Written to <log.dir>/terminal-<serial>.log as well as the console
log.dir=logs
